[theme]
primaryColor = "#8B7CF6"
font = "sans serif"
showWidgetBorder = true

[theme.light]
backgroundColor = "#F4F6FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172033"
borderColor = "#D8E0EF"
linkColor = "#6557D9"

[theme.dark]
backgroundColor = "#0A0F1E"
secondaryBackgroundColor = "#131A2B"
textColor = "#F3F4FC"
borderColor = "#26324B"
